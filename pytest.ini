[pytest]
# generator/ and orchestrator/ are each their own import root (e.g. generator/main.py
# does `from src.generator import ...` assuming cwd/sys.path == generator/), so tests
# living under generator/tests/ need generator/ itself on sys.path to import `src.*`.
# "." (repo root) is needed for `import trackcheck` (trackcheck/ lives at the repo
# root so it's importable by orchestrator/ and generator/ alike without either
# importing the other -- see trackcheck/__init__.py).
pythonpath = . generator orchestrator
testpaths = generator/tests orchestrator/tests trackcheck/tests dashboard/tests
