# Bot launch configuration — edit this file to change defaults.
# All settings can still be overridden with command-line flags.

PLAYLIST="all_official_races"   # Playlist name from playlists.json
INTERVAL=200               # Track rotation interval in seconds
SHUFFLE=1                  # 1 = shuffle playlist order, 0 = keep order
PUBLIC=0                   # 1 = public lobby, 0 = private
HEADLESS=0                 # 1 = Xvfb (no window), 0 = GUI on :0
BUILD=1                    # 1 = build+sync on launch, 0 = skip (faster restart)
WIDTH=1280                 # Game window width (e.g. 1280)
HEIGHT=720                 # Game window height (e.g. 720)
