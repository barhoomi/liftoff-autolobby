# Convenience wrapper around `docker build` / `docker run` for local operation. Not part
# of the feature spec's acceptance criteria (which targets plain `docker run --env-file`),
# but the volumes/env plumbing is identical either way -- use whichever you prefer.
#
# Usage:
#   cp .env.example .env   # fill in STEAM_ACCOUNT etc.
#   docker compose build
#   docker compose up
#
# One-time human setup (GUI-first since 2026-08-05 -- Liftoff cannot be installed through
# steamcmd on this account, so the graphical Steam client does both jobs):
#   1. docker compose up -d          # brings up Xvfb + x11vnc + the Steam client
#   2. ssh -L 5900:127.0.0.1:5900 <user>@<host>    # 5900 is loopback-bound on purpose
#   3. VNC to localhost:5900 -> log in (keep "Remember me") -> Library -> Liftoff -> Install
#   The entrypoint waits for the login AND for the finished install, then continues on its
#   own (BepInEx -> plugin build -> orchestrator). Runbook:
#   docs/features/doing/bot-priming-this-host.md.
#
# DEFERRED (possible future Workshop use, NOT part of the boot path): the steamcmd
# install/update stage still exists behind USE_STEAMCMD=1, with its one-time prime:
#   docker compose run --rm -it -u botuser -e HOME=/steam --entrypoint /usr/games/steamcmd bot \
#       +force_install_dir /steam/Liftoff +login <STEAM_ACCOUNT> +quit
#   (full path needed: /usr/games isn't on PATH outside an interactive login shell)
#
# Pulling a Steam Workshop track into the RUNNING bot (no restart). ALWAYS with
# `--user botuser` -- `docker compose exec` defaults to root, and a root-invoked run
# leaves root-owned protocol files under BepInEx/plugins/ that the plugin (running as
# botuser) cannot write, which broke /track live on 2026-09-03:
#   docker compose exec --user botuser bot python3 orchestrator/download_workshop_item.py <track_id> <race_id>
# (Liftoff publishes a track and its race as separate workshop items; pass both ids.)
#
# Admin chat commands (docs/features/doing/container-seed-admin-ids.md): set ADMIN_IDS in
# .env (simplest -- see .env.example), OR mount your own admin_ids.txt into the bot_config
# volume at /config/admin_ids.txt (uncomment a bind mount below, or `docker compose cp`
# it into the volume once); ADMIN_IDS takes precedence when both are present. Leaving both
# unset is not an error -- it reproduces the plugin's existing fail-closed default (no
# admins) until you configure one of them.
# Shared image reference (bot + dashboard sidecar run from the identical built image;
# only the entrypoint/command/volumes/user differ). Kept as an anchor so the two service
# definitions can never drift onto two different images by accident.
x-bot-image: &bot-image procedural-fpv-bot:local

services:
  bot:
    build: .
    image: *bot-image
    env_file:
      - .env
    environment:
      # Where Steam puts subscribed/downloaded Workshop items for AppID 410340. Belt to
      # gather_tracks.py's braces (workshop-ingest-hardening.md §3): that resolver now
      # derives this from the config's game_dir, but the container's install lives under
      # /steam/... while its remaining candidates are all /home/<user>/... -- which is why
      # the bot scanned 0 workshop tracks. Hardcoded to the GUI-first install path for the
      # same reason FPV_GAME_DIR/FPV_PLUGINS_DIR are, below. If you run with USE_STEAMCMD=1
      # in .env, override this to /steam/Liftoff/../workshop/content/410340.
      FPV_WORKSHOP_CONTENT_DIR: /steam/.steam/debian-installation/steamapps/workshop/content/410340
    volumes:
      - steam_data:/steam
      - bot_logs:/logs
      - bot_config:/config
      # Optional alternative to the ADMIN_IDS env var (see .env.example and
      # docs/features/doing/container-seed-admin-ids.md): bind-mount a local admin_ids.txt
      # (one Photon user ID per line, '#' comments allowed) instead of using the env var.
      # - ./admin_ids.txt:/config/admin_ids.txt:ro
    # Xvfb/Steam/Liftoff need real shared memory, not Docker's tiny 64MB default.
    shm_size: "1gb"
    # x11vnc on the container's Xvfb display. Needed ONCE per fresh /steam volume: the
    # graphical Steam client keeps its own login state (loginusers.vdf) and steamcmd's
    # primed token cannot log it in (it's machine-scoped -- JWT aud:["machine"]), so a
    # human must log in through the client's UI one time via VNC; the client's token then
    # persists in the volume. Also handy for watching the game render. Host-side bind is
    # 127.0.0.1 only (x11vnc runs -nopw; do not expose this beyond localhost).
    ports:
      - "127.0.0.1:5900:5900"
    # TEMPORARY, not hardened -- see docs/features/backlog/docker-steam-sandbox-hardening.md.
    # Steam's Linux compat layer (Pressure Vessel) needs to create unprivileged user
    # namespaces (via bubblewrap/bwrap) to start its sandboxed runtime. Found live
    # 2026-07-12: this needed THREE escalating relaxations to get past three distinct
    # bwrap failures in sequence (namespace creation -> mount-slave propagation ->
    # pivot_root); SYS_ADMIN alone and SYS_ADMIN+apparmor=unconfined each got one step
    # further but not all the way. STEAM_RUNTIME=0 (skip the sandbox entirely) was tried
    # and made things worse (hangs on an interactive prompt with no TTY). Landed on the
    # full combination below as the first thing that actually got Steam's sandbox running
    # end-to-end. This is broader than ideal for a long-lived deployment -- revisit once
    # steady-state operation is confirmed, per the backlog doc.
    cap_add:
      - SYS_ADMIN
    security_opt:
      - apparmor=unconfined
      - seccomp=unconfined
    # Deliberately NOT "unless-stopped"/"always": an expired/invalid Steam token is a
    # *fatal, human-actionable* condition (see docker-entrypoint.sh's auth-cache check and
    # steamcmd-failure handling) -- auto-restarting on top of that would turn one loud,
    # clear error into a silent crash loop, which the feature spec explicitly calls out to
    # avoid. Once credentials are primed and steady-state operation is verified, operators
    # may reasonably switch this to `on-failure:3` or similar.
    restart: "no"

  # docs/features/doing/bot-dashboard.md -- FastAPI monitoring/control sidecar. Same image
  # as `bot` (see the `*bot-image` anchor above). NOTE: the app layer (dashboard/{api,
  # write_api,__main__}.py + static/) moved to the private liftoff-dashboard repo, so the
  # image bakes only dashboard/control -- this service now REQUIRES the
  # docker-compose.dashboard-dev.yml overlay, whose bind mount supplies the app files
  # (rsync'd by that repo's deploys) merged with this repo's control/. Without the
  # overlay, `python3 -m dashboard` has no __main__ to run.
  # Its ENTRYPOINT is overridden outright
  # (not just `command:`): the image's default entrypoint is docker-entrypoint.sh, which
  # unconditionally runs the full Xvfb/Steam/game-install/plugin-build boot sequence and
  # ends in a hardcoded `exec` into the orchestrator -- it does not respect `command:`, so
  # only overriding `command:` here would still boot a second, redundant Steam/game stack.
  # `python -m dashboard` (see dashboard/__main__.py) is a plain uvicorn process with none
  # of that -- it only needs read/write access to the same files the plugin/orchestrator
  # already use.
  dashboard:
    image: *bot-image
    entrypoint: ["/usr/bin/tini", "--", "python3", "-m", "dashboard"]
    env_file:
      - .env
    environment:
      # D1 (private on host): the dashboard must bind 0.0.0.0 *inside* the container for
      # the `ports:` publish below to reach it at all -- same pattern as x11vnc binding
      # container-wide while the compose `ports:` entry is what actually restricts host
      # exposure to 127.0.0.1. Pinned here (not left to .env) so the app's listening port
      # can never drift out of sync with the `ports:` mapping two lines down.
      FPV_DASHBOARD_HOST: "0.0.0.0"
      FPV_DASHBOARD_PORT: "8800"
      # dashboard/control/settings.py: "FPV_PROJECT_DIR lets a sidecar deployment point at
      # a checkout/config tree other than the one this package was imported from" -- exactly
      # this deployment. Paired with the bot_config mount below at /data/config, this makes
      # dashboard.control.paths.config_dir() resolve to /data/config, i.e. the SAME
      # config/{lobby_config,playlists,master_tracks_list}.json the bot service reads/writes
      # via its own /config mount + boot-time symlinks -- without needing this container to
      # replicate the bot entrypoint's symlink-seeding step.
      FPV_PROJECT_DIR: /data
      # Single log-dir resolver (orchestrator/event_log.py, re-exported through
      # dashboard.control.paths.resolve_log_dir) -- same variable name and same value the
      # bot's entrypoint exports for the orchestrator/plugin side, so both containers agree
      # on where the JSONL event log lives without re-deriving it.
      FPV_LOG_DIR: /logs
      # BepInEx plugins dir -- the plugin <-> control-plane protocol-file rendezvous point
      # (dashboard/control/protocol.py) -- and the game dir (BepInEx/LogOutput.log,
      # Player.log for the log browser). Hardcoded to the GUI-first install path
      # (docker-entrypoint.sh's CLIENT_LIBRARY_INSTALL_DIR, the default since USE_STEAMCMD
      # defaults to 0) rather than left to auto-detection: auto-detection goes through
      # lobby_config.json's liftoff_path, which only gets rewritten to a container-correct
      # value by the BOT service's entrypoint on ITS boot -- a dashboard-only restart (bot
      # not yet up) would otherwise resolve against a stale or host-shaped path. If you run
      # with USE_STEAMCMD=1 in .env, override both of these to /steam/Liftoff(/BepInEx/plugins).
      FPV_GAME_DIR: /steam/.steam/debian-installation/steamapps/common/Liftoff
      FPV_PLUGINS_DIR: /steam/.steam/debian-installation/steamapps/common/Liftoff/BepInEx/plugins
      # Same value and the same reasoning as the bot service's entry (see there); both
      # containers must agree on where a workshop item landed. If you run with
      # USE_STEAMCMD=1 in .env, override this too.
      FPV_WORKSHOP_CONTENT_DIR: /steam/.steam/debian-installation/steamapps/workshop/content/410340
    volumes:
      # Whole volume, same as the bot service -- Compose has no way to mount only a
      # subdirectory of a named volume -- but only BepInEx/plugins under it is actually
      # written (protocol files); everything else here is read-only in practice even though
      # the mount itself can't express that at the volume level.
      - steam_data:/steam
      # Read-only: the dashboard only tails/aggregates the JSONL event log and BepInEx's own
      # log file, never writes into /logs.
      - bot_logs:/logs:ro
      # Read-write, deliberately NOT :ro: the playlist manager (dashboard/control/
      # playlist_store.py, D5/"Phase 3 write side") saves playlists.json here via
      # atomic temp+os.replace, and lobby_config.json's "dashboard" section is where D2's
      # token/D3's restart flag may alternatively live. Mounted at /data/config (not
      # /config) to line up with FPV_PROJECT_DIR=/data above.
      - bot_config:/data/config
    # Runs as the same uid/gid the bot's entrypoint chowns /steam, /logs and /config to
    # (Dockerfile: `useradd -u 1000 ... botuser`). Protocol files this container writes
    # into BepInEx/plugins/ must be owned by that uid or the plugin (running as botuser
    # inside the bot container) may not be able to read/replace them, and playlists.json
    # written here must stay consistent with what the orchestrator (also botuser) writes.
    user: "botuser"
    ports:
      - "127.0.0.1:8800:8800"
    # Consistent with the bot service's policy (see its comment above) rather than
    # independently chosen. Unlike the bot, the dashboard has no fatal/human-actionable
    # startup condition analogous to an expired Steam token EXCEPT a missing
    # FPV_DASHBOARD_TOKEN (D2) -- which is exactly as loud and exactly as
    # human-actionable (see dashboard/__main__.py's TOKEN_HELP), so the same reasoning for
    # not auto-restarting applies. Operators who set the token once and want the process to
    # survive a uvicorn crash may reasonably switch this to `on-failure:3`.
    restart: "no"

volumes:
  # Pinned to the human-primed volumes from the 2026-07-15 verified session (external, so
  # they are used AS-IS and never re-created under a project-name prefix). Declaring these
  # external is what prevents the "fresh project-name volume" trap that crashed the previous
  # boot: compose derives its project name from the worktree dir name
  # (integration-decomp-democracy), and without these pins it silently created BRAND-NEW
  # empty integration-decomp-democracy_* volumes -- steamcmd then exited 5 ("No cached
  # credentials and @NoPromptForPassword is set") because the fresh /steam had no login and
  # no install to fall back on.
  #
  # steam_data holds BOTH the ~22.5G Liftoff install AND the two Steam login tokens
  # (steamcmd's config.vdf + the graphical client's loginusers.vdf). Re-priming it requires
  # an interactive Steam Guard login over VNC -- it is IRREPLACEABLE without a human. NEVER
  # delete it, never `docker volume prune`, never `compose down -v`.
  steam_data:
    external: true
    name: agent-af473f774bb75bf19_steam_data
  # bot_config is ALSO pinned to the primed volume, not project-local: it holds the seeded
  # master_tracks_list.json (90 official tracks). That file ships in NEITHER the repo nor the
  # image (it's gitignored / generated at runtime), so the entrypoint's seed-if-missing logic
  # cannot re-create it -- a fresh /config would resolve the playlist to 0 tracks and skip
  # room creation entirely (the fresh-install track-discovery deadlock). lobby_config.json /
  # playlists.json in here are compatible with this branch and are not overwritten (the
  # entrypoint only rewrites lobby_config.json's liftoff_path/display in place each boot).
  bot_config:
    external: true
    name: agent-af473f774bb75bf19_bot_config
  # bot_logs pinned external too, for full fidelity to the verified-session artifact (append-
  # only per-day JSONL; no re-creation risk). Player.log lives under the steam volume
  # ($HOME/.config/unity3d/...), not here -- this volume only holds the orchestrator's
  # structured JSONL.
  bot_logs:
    external: true
    name: agent-af473f774bb75bf19_bot_logs
